<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bernie · Home Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="static/css/panels.css?v=100">
  <link rel="stylesheet" href="static/css/v3.css?v=100">
  <link rel="stylesheet" href="static/css/v3_cameras.css?v=100">
  <link rel="stylesheet" href="static/css/v3_tasks.css?v=100">
  <link rel="stylesheet" href="static/css/v3_calendar.css?v=100">
  <!-- family-bot-wze: Leaflet loaded on demand (Family map / Door) -->
</head>
<body data-theme="dark">
  <div id="app" class="app">
    <!-- Rendered via JS -->
  </div>

  <!-- family-bot-10y: accessible login — who is using the tablet -->
  <div id="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title" aria-describedby="login-desc">
    <div class="brand-mark is-large" aria-hidden="true"></div>
    <div style="text-align: center;">
      <div class="brand-name" id="login-title" style="font-size: 2rem;">bernie</div>
      <div class="brand-sub" id="login-desc">Who's using the tablet?</div>
    </div>
    
    <div id="login-avatar-grid" role="list" aria-label="Family members" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; max-width: 300px; margin: 20px auto;"></div>
    
    <form id="login-form" style="display: none; align-items: center; flex-direction: column;" aria-label="Enter password">
      <div id="login-selected-user" style="font-weight: 600; margin-bottom: 12px; color: var(--ink-1);"></div>
      <label for="login-token" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Password</label>
      <input
        type="password"
        id="login-token"
        name="pin"
        inputmode="text"
        autocomplete="current-password"
        enterkeyhint="done"
        placeholder="Password"
        minlength="1"
        maxlength="64"
        required
        aria-required="true"
        aria-describedby="login-err"
        style="text-align: center; letter-spacing: .1em; font-size: 20px; width: 100%;"
      />
      <button type="submit" id="login-submit" style="margin-top: 12px; width: 100%;">Unlock</button>
      <button type="button" id="login-back" class="btn" style="margin-top: 8px; width: 100%; background: transparent; color: var(--ink-2); border: none;">Back</button>
      <div id="login-err" role="alert" aria-live="assertive"></div>
    </form>
  </div>

  <script src="static/js/data.js?v=100"></script>
  <script src="static/js/app.v6.js?v=100"></script>
  <script src="static/js/v3_activity.js?v=100"></script>
  <script src="static/js/v3_network.js?v=100"></script>
  <script src="static/js/v3_settings.js?v=100"></script>
  <script src="static/js/v3_logs.js?v=100"></script>
  <script src="static/js/v3_config.js?v=100"></script>
  <script src="static/js/v3_family.js?v=100"></script>
  <script src="static/js/v3_tasks.js?v=100"></script>
  <script src="static/js/v3_home.js?v=100"></script>
  <script src="static/js/v3_today.js?v=100"></script>
  <script src="static/js/v3_calendar.js?v=100"></script>
  <script src="static/js/v3_grocery.js?v=100"></script>
  <script src="static/js/v3_cameras.js?v=100"></script>
  <script src="static/js/v3_admin.js?v=100"></script>
</body>
</html>
