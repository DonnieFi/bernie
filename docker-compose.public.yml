# Public / generic stack: three standard services plus an optional, isolated
# Codex OAuth runner. It intentionally excludes host-specific LAN, CA, NFS,
# and log mounts.
# Set TZ in the environment.
#
# Phase 40A — Container split (ADR-0003 single writer)
# bernie-discord / bernie-api / bernie-cognition
# bernie-cognition: RW ./data (sole SQLite writer)
# bernie-discord / bernie-api: RO ./data (writes via cognition /internal/db/write)
#
# Secrets (including INTERNAL_POST_SECRET and optional
# SUBSCRIPTION_RUNNER_SECRET) come from .env — never hardcode them here.

services:
  bernie-discord:
    build: ./bot
    container_name: bernie-discord
    restart: unless-stopped
    command: python -u main.py --role discord
    environment:
      - ROLE=discord
      - LOG_PREFIX=[discord]
      - TZ=${TZ:-America/Halifax}
      - PYTHONUNBUFFERED=1
      # INTERNAL_POST_SECRET is supplied via env_file (.env) — used by the
      # hardened /internal/post endpoint (fails closed if unset).
    env_file: .env
    volumes:
      # RO — discord routes mutations via bernie-cognition:9000/internal/db/write
      - ./data:/data:ro
      - ./bot:/app
      - ./config.json:/app/config.json
      - ./credentials:/credentials
      - ./docs:/docs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - bernie-net
    depends_on:
      bernie-cognition:
        condition: service_healthy
    # Internal server on 9000 (bernie-net only) serves /internal/post for cognition
    healthcheck:
      # bot.is_ready() or on_ready file flag (see plan). Internal post server starts with the role.
      test: ["CMD", "test", "-f", "/tmp/bernie_discord_ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bernie-api:
    build: ./bot
    container_name: bernie-api
    restart: unless-stopped
    command: python -u main.py --role api
    ports:
      - "8000:8000"
    environment:
      - ROLE=api
      - LOG_PREFIX=[api]
      - TZ=${TZ:-America/Halifax}
      - PYTHONUNBUFFERED=1
    env_file: .env
    volumes:
      # RO — API routes mutations via bernie-cognition:9000/internal/db/write
      - ./data:/data:ro
      - ./bot:/app
      - ./config.json:/app/config.json
      - ./credentials:/credentials
      - ./docs:/docs
      - ./web:/web
    networks:
      - bernie-net
    depends_on:
      bernie-cognition:
        condition: service_healthy
    healthcheck:
      # Use Python stdlib instead of curl (not installed in the slim image)
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bernie-cognition:
    build: ./bot
    container_name: bernie-cognition
    restart: unless-stopped
    command: python -u main.py --role cognition
    environment:
      - ROLE=cognition
      - LOG_PREFIX=[cognition]
      - TZ=${TZ:-America/Halifax}
      - PYTHONUNBUFFERED=1
      # INTERNAL_POST_SECRET is supplied via env_file (.env) — must match the
      # value bernie-discord uses (cognition→discord /internal/post client).
      # Cognition also serves /internal/db/write on port 9000 for discord/api writes.
    env_file: .env
    volumes:
      # RW — sole SQLite writer (ADR-0003)
      - ./data:/data
      - ./bot:/app
      - ./config.json:/app/config.json
      - ./credentials:/credentials
      - ./docs:/docs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - bernie-net
    healthcheck:
      # Internal write RPC on :9000 must be up before discord/api start (40A soak)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/internal/db/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G

  # Optional: ChatGPT/Codex OAuth only. Start with
  # `docker compose --profile subscriptions up -d` after following
  # docs/subscription-providers.md. The runner has no household credentials.
  bernie-subscription-runner:
    profiles: ["subscriptions"]
    build:
      context: ./subscription_runner
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.144.6}
        INSTALL_GROK: "false"
    container_name: bernie-subscription-runner
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    environment:
      - CODEX_HOME=/var/lib/bernie/codex
      # Grok OAuth is not a public feature yet; its runtime state is ephemeral.
      - GROK_HOME=/tmp/grok
      - RUNNER_MAX_ACTIVE=${SUBSCRIPTION_RUNNER_MAX_ACTIVE:-2}
      - RUNNER_MAX_QUEUE=${SUBSCRIPTION_RUNNER_MAX_QUEUE:-4}
      - RUNNER_QUEUE_TIMEOUT_S=${SUBSCRIPTION_RUNNER_QUEUE_TIMEOUT_S:-30}
      # The runner receives only this shared secret, never the main .env.
      - SUBSCRIPTION_RUNNER_SECRET=${SUBSCRIPTION_RUNNER_SECRET:-}
    volumes:
      - bernie-codex-home:/var/lib/bernie/codex
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    networks:
      - bernie-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  bernie-net:
    driver: bridge

volumes:
  bernie-codex-home:
